name: Policy check

on:
  workflow_call:
    inputs:
      infra-path:
        description: Path to the Terraform infra directory to scan.
        required: true
        type: string

jobs:
  conftest:
    name: Conftest (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          set -euo pipefail
          version=0.68.2
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${version}/conftest_${version}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo install conftest /usr/local/bin/conftest
          conftest --version

      - name: Run Conftest
        run: |
          conftest test \
            --parser hcl2 \
            --policy policy/conftest \
            --no-color=false \
            "${{ inputs.infra-path }}"

  trivy:
    name: Trivy (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail
          version=0.70.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy
        run: |
          trivy config \
            --raw-config-scanners=terraform \
            --config-check policy/trivy \
            --check-namespaces user \
            --exit-code 1 \
            "${{ inputs.infra-path }}"

  checkov:
    name: Checkov (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install --upgrade checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory "${{ inputs.infra-path }}" \
            --external-checks-dir "$(realpath checkov_custom)" \
            --framework terraform \
            --compact

  secure-attrs:
    # Soft / advisory check: emits a SARIF report for every module call that opts
    # out of the secure default. Never fails the build (--exit-code 0); the SARIF
    # upload surfaces findings as GitHub code-scanning annotations on the PR.
    name: Secure-attr SARIF (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail
          version=0.70.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy (SARIF, advisory)
        run: |
          trivy config \
            --raw-config-scanners=terraform \
            --config-check policy/trivy-soft \
            --check-namespaces user \
            --format sarif \
            --output trivy.sarif \
            --exit-code 0 \
            "${{ inputs.infra-path }}"

      - name: Rewrite SARIF paths to be repo-root-relative
        # Trivy emits artifactLocation.uri as scan-target-relative (e.g. "main.tf"),
        # but GitHub code scanning needs repo-relative paths (e.g. "infra/main.tf")
        # to map findings onto the PR diff. Otherwise the Trivy check reports
        # "No new alerts in code changed by this pull request" even when there are.
        run: |
          set -euo pipefail
          prefix="${{ inputs.infra-path }}/"
          jq --arg p "$prefix" '
            .runs |= map(
              .results |= map(
                .locations |= map(
                  .physicalLocation.artifactLocation.uri |=
                    (if startswith("/") or startswith($p) then . else $p + . end)
                )
              )
            )
          ' trivy.sarif > trivy.sarif.tmp
          mv trivy.sarif.tmp trivy.sarif
          echo "--- SARIF preview ---"
          jq '{
            findings: (.runs[0].results | length),
            paths: [.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | unique
          }' trivy.sarif

      - name: Upload SARIF to GitHub code scanning
        # Code scanning is free on public repos and requires GitHub Advanced
        # Security on private repos. Tolerate the upload failing so the job
        # itself stays green — the SARIF artifact below is the always-on path.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: secure-attrs-${{ inputs.infra-path }}

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-attrs-sarif-${{ inputs.infra-path }}
          path: trivy.sarif
          if-no-files-found: warn
