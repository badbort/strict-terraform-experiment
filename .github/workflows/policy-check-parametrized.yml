name: Policy check (parametrized)

on:
  workflow_call:
    # NOTE: workflow_call inputs only support string / number / boolean / choice —
    # there is no native list/array type. We accept `allowed-module-sources` as a
    # JSON-encoded array string (e.g. '["../modules/","../shared-modules/"]') and
    # decode it inside each job via `jq`. JSON is preferred over a delimited list
    # because it preserves prefixes containing commas/spaces and round-trips
    # cleanly into Conftest/Trivy `data` documents.
    inputs:
      infra-path:
        description: Path to the Terraform infra directory to scan.
        required: true
        type: string
      allowed-module-sources:
        description: >-
          JSON array (as a string) of allowed module source prefixes,
          e.g. '["../modules/","../shared-modules/"]'.
        required: true
        type: string

jobs:
  conftest:
    name: Conftest (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    env:
      ALLOWED: ${{ inputs.allowed-module-sources }}
    steps:
      - uses: actions/checkout@v4

      - name: Build allowed.json
        run: |
          set -euo pipefail
          echo "${ALLOWED}" | jq '{allowed:{module_sources:.}}' > allowed.json
          cat allowed.json

      - name: Install Conftest
        run: |
          set -euo pipefail
          version=0.68.2
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${version}/conftest_${version}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo install conftest /usr/local/bin/conftest
          conftest --version

      - name: Run Conftest
        run: |
          conftest test \
            --parser hcl2 \
            --policy policy/conftest-param \
            --data allowed.json \
            --no-color=false \
            "${{ inputs.infra-path }}"

  trivy:
    name: Trivy (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    env:
      ALLOWED: ${{ inputs.allowed-module-sources }}
    steps:
      - uses: actions/checkout@v4

      - name: Build allowed.json
        run: |
          set -euo pipefail
          echo "${ALLOWED}" | jq '{allowed:{module_sources:.}}' > allowed.json
          cat allowed.json

      - name: Install Trivy
        run: |
          set -euo pipefail
          version=0.70.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy
        run: |
          trivy config \
            --raw-config-scanners=terraform \
            --config-check policy/trivy-param \
            --check-namespaces user \
            --config-data allowed.json \
            --exit-code 1 \
            "${{ inputs.infra-path }}"

  checkov:
    name: Checkov (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    env:
      ALLOWED: ${{ inputs.allowed-module-sources }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install --upgrade checkov

      - name: Compute allowed path substrings
        id: allowed
        run: |
          set -euo pipefail
          # Flatten the JSON array into a comma-separated list of substrings
          # that the custom Checkov check matches against `self.entity_path`.
          substrings=$(echo "${ALLOWED}" | jq -r 'join(",")')
          echo "substrings=${substrings}" >> "$GITHUB_OUTPUT"
          echo "Allowed path substrings: ${substrings}"

      - name: Run Checkov
        env:
          ALLOWED_MODULE_PATH_SUBSTRINGS: ${{ steps.allowed.outputs.substrings }}
        run: |
          checkov \
            --directory "${{ inputs.infra-path }}" \
            --external-checks-dir "$(realpath checkov_custom_param)" \
            --framework terraform \
            --compact
