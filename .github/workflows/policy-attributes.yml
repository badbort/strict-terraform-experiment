name: Policy attributes (soft / advisory)

# The "soft" policy layer: runs per-tool attribute checks against a given
# infra path, emits SARIF, and uploads to GitHub Code Scanning so findings
# show up as PR annotations and Security tab alerts. None of these jobs
# fail the build on a finding — they're advisory by design.

on:
  workflow_call:
    inputs:
      infra-path:
        description: Path to the Terraform infra directory to scan.
        required: true
        type: string

jobs:
  trivy-attributes:
    name: Trivy attribute SARIF (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail
          version=0.70.0
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${version}/trivy_${version}_Linux-64bit.tar.gz" \
            | tar -xz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy
        run: |
          trivy config \
            --raw-config-scanners=terraform \
            --config-check policy/trivy-soft \
            --check-namespaces user \
            --format sarif \
            --output trivy.sarif \
            --exit-code 0 \
            "${{ inputs.infra-path }}"

      - name: Rewrite SARIF paths to repo-root-relative
        # Trivy emits paths relative to the scan target (e.g. "main.tf"), but
        # code scanning needs them relative to the repo root ("infra/main.tf")
        # to match the PR diff and surface annotations.
        run: |
          set -euo pipefail
          prefix="${{ inputs.infra-path }}/"
          jq --arg p "$prefix" '
            .runs |= map(
              .results |= map(
                .locations |= map(
                  .physicalLocation.artifactLocation.uri |=
                    (if startswith("/") or startswith($p) then . else $p + . end)
                )
              )
            )
          ' trivy.sarif > trivy.sarif.tmp
          mv trivy.sarif.tmp trivy.sarif
          echo "--- SARIF preview ---"
          jq '{
            findings: (.runs[0].results | length),
            paths:    [.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | unique
          }' trivy.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: attrs-trivy-${{ inputs.infra-path }}

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attrs-trivy-sarif-${{ inputs.infra-path }}
          path: trivy.sarif
          if-no-files-found: warn

  checkov-attributes:
    name: Checkov attribute SARIF (${{ inputs.infra-path }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install --upgrade checkov

      - name: Run Checkov (soft)
        # --check filters to ONLY our soft check; built-in checks are skipped.
        # When new soft check IDs are added to checkov_custom_soft/, list them
        # here (comma-separated) to surface them in this SARIF.
        run: |
          set -euo pipefail
          checkov \
            --directory "${{ inputs.infra-path }}" \
            --external-checks-dir "$(realpath checkov_custom_soft)" \
            --framework terraform \
            --check CKV_SOFT_MODULE_ATTRS \
            --output sarif \
            --output-file-path . \
            --soft-fail
          ls -la results_sarif.sarif

      - name: Rewrite SARIF paths to repo-root-relative + strip invalid attachments
        # Checkov writes `attachments[]` entries that fail GitHub's strict SARIF
        # schema validation (missing `artifactLocation`, `description` is a string
        # not an object). Drop them; everything we need is in `locations[]`.
        run: |
          set -euo pipefail
          prefix="${{ inputs.infra-path }}/"
          jq --arg p "$prefix" '
            .runs |= map(
              .results |= map(
                (.attachments |= []) |
                (.locations |= map(
                  .physicalLocation.artifactLocation.uri |=
                    (if startswith("/") or startswith($p) then . else $p + . end)
                ))
              )
            )
          ' results_sarif.sarif > results_sarif.sarif.tmp
          mv results_sarif.sarif.tmp results_sarif.sarif
          echo "--- SARIF preview ---"
          jq '{
            findings: (.runs[0].results | length),
            paths:    [.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | unique
          }' results_sarif.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results_sarif.sarif
          category: attrs-checkov-${{ inputs.infra-path }}

      - name: Upload SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attrs-checkov-sarif-${{ inputs.infra-path }}
          path: results_sarif.sarif
          if-no-files-found: warn
